# Include inside the existing calculator server block. Keep its root and /api intact.
location = /address-book { return 301 /address-book/; }

location ^~ /address-book/api/ {
    client_max_body_size 6m;
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
location = /address-book/docs { proxy_pass http://127.0.0.1:8001/docs; }
location = /address-book/openapi.json { proxy_pass http://127.0.0.1:8001/openapi.json; }
location = /address-book/config.js {
    alias /var/www/address-book/config.js;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
}
location /address-book/ {
    alias /var/www/address-book/;
    index index.html;
}
